buildscript {
  repositories { mavenCentral() }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
    classpath("org.jetbrains.kotlin:kotlin-serialization:${kotlinVersion}")
  }
}
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

android {
  namespace 'com.clerk.ui'
  compileSdk rootProject.ext.compileSdkVersion
  defaultConfig {
    minSdk rootProject.ext.minSdkVersion
    consumerProguardFiles 'consumer-rules.pro'
  }
  buildFeatures { compose true }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = '17'
    freeCompilerArgs += ['-Xskip-metadata-version-check']
  }
}

dependencies {
  api 'com.clerk:clerk-android-api:1.4.1'
  api 'com.clerk:clerk-android-telemetry:1.1.2'
  implementation platform('androidx.compose:compose-bom:2026.06.01')
  implementation 'androidx.activity:activity-compose:1.13.0'
  implementation 'androidx.appcompat:appcompat:1.8.0'
  implementation 'androidx.compose.foundation:foundation'
  implementation 'org.jetbrains.compose.material:material-icons-core:1.7.3'
  implementation 'androidx.compose.runtime:runtime'
  implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
  implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
  implementation 'androidx.lifecycle:lifecycle-viewmodel-navigation3:2.10.0'
  implementation 'androidx.navigation3:navigation3-runtime:1.1.7'
  implementation 'androidx.navigation3:navigation3-ui:1.1.7'
  implementation 'androidx.compose.ui:ui'
  implementation 'io.coil-kt.coil3:coil-compose:3.5.0'
  implementation 'io.coil-kt.coil3:coil-network-okhttp:3.5.0'
  implementation 'com.googlecode.libphonenumber:libphonenumber:9.0.42'
  implementation 'org.jetbrains.kotlinx:kotlinx-collections-immutable:0.5.2'
  implementation 'androidx.compose.material3:material3:1.4.0'
  implementation 'com.materialkolor:material-kolor:4.1.1'
  compileOnly 'androidx.compose.ui:ui-tooling-preview-android:1.12.1'
  testImplementation 'junit:junit:4.13.2'
}
